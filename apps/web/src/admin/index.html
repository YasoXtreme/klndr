<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2ffec" />

    <!-- Stamps the pinned theme before the first paint. Must stay the first
         script on the page, same as index.html and login.html. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("klndr:theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {}
      })();
    </script>

    <title>klndr admin</title>
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <!-- Opened while the page's own files load, so the icon font is not two
         round trips behind them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/assets/ElmsSans.ttf"
      crossorigin
    />

    <!-- The boot overlay's styles, written in here by the build from
         src/shared/boot.css: the loading screen cannot wait on a file of its
         own. -->
    <!-- klndr:boot.css -->

    <!-- The page's stylesheet, as built from the imports in main.js. The build
         puts it here, before the icon font's stylesheet below: that one
         also styles .material-symbols-outlined, and the later sheet wins at
         equal specificity. -->
    <!-- klndr:styles -->

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      />
    </noscript>
  </head>
  <body data-boot="admin">
    <!-- The boot overlay: the build writes src/shared/boot.js in here,
         and it puts the klndr logo up, admin tag and all, before anything
         else is parsed. admin/shell.js calls KlndrBoot.ready() once the first
         page has drawn, and the logo flies into whichever of the two brands
         below (data-boot-brand) is on screen. -->
    <!-- klndr:boot.js -->
    <!-- The frame every admin tool shares; admin/shell.js fills the sidebar
         from the sections that register, and each section fills the header and
         the content. The server sends this page for every URL under /admin. -->
    <div class="adm-app">
      <!-- Phones and tablets only: the sidebar becomes a drawer behind this. -->
      <header class="adm-mobilebar" id="admMobilebar">
        <button
          type="button"
          class="ann-icon-btn"
          id="admMenuButton"
          aria-controls="admSidebar"
          aria-expanded="false"
          aria-label="Admin menu"
        >
          <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <a class="adm-brand" href="/admin" data-adm-home data-boot-brand aria-label="klndr admin home">
          <span class="klndr-lockup" aria-hidden="true">
            <span class="klndr-plate"><span>k</span></span>
            <span class="klndr-wordmark">klndr</span>
          </span>
          <span class="adm-tag" aria-hidden="true">admin</span>
        </a>
      </header>

      <aside class="adm-sidebar" id="admSidebar" aria-label="Admin">
        <a class="adm-brand" href="/admin" data-adm-home data-boot-brand aria-label="klndr admin home">
          <span class="klndr-lockup" aria-hidden="true">
            <span class="klndr-plate"><span>k</span></span>
            <span class="klndr-wordmark">klndr</span>
          </span>
          <span class="adm-tag" aria-hidden="true">admin</span>
        </a>
        <nav class="adm-nav" id="admNav" aria-label="Admin sections"></nav>
        <div class="adm-sidebar-foot">
          <p class="adm-whoami" id="admWhoami"></p>
          <a class="adm-nav-link" href="/" data-boot-leave="app">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            <span>Back to klndr</span>
          </a>
        </div>
      </aside>
      <div class="adm-scrim" id="admScrim" hidden></div>

      <main class="adm-main" id="admMain">
        <header class="adm-header" id="admHeader"></header>
        <div class="adm-content" id="adminContent" tabindex="-1">
          <p class="an-loading">Opening admin…</p>
        </div>
      </main>
    </div>

    <div class="adm-toast" id="admToast" role="status" aria-live="polite" hidden></div>

    <!-- The shell and every section, imported by main.js in sidebar order. The build replaces this with the bundle, hashed, in the
         <head>; a module runs once the page is parsed, as these scripts did
         from the end of <body>. -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
