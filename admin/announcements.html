<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2ffec" />

    <!-- Stamps the pinned theme before the first paint. Must stay the first
         script on the page, same as index.html, login.html and analytics.html. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("klndr:theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {}
      })();
    </script>

    <title>klndr · Announcement Studio</title>
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />

    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/assets/ElmsSans.ttf"
      crossorigin
    />

    <link rel="stylesheet" href="/public/css/theme.css" />
    <link rel="stylesheet" href="/public/css/common.css" />
    <!-- The admin chrome - topbar, cards, tables, stat tiles - belongs to
         analytics.css, and this page is its sibling, so it wears the same. -->
    <link rel="stylesheet" href="/admin/analytics.css" />
    <!-- The rules the app itself draws announcements with, so the preview on
         this page is the real thing rather than a lookalike. -->
    <link rel="stylesheet" href="/protected/css/announcements.css" />
    <link rel="stylesheet" href="/admin/announcements.css" />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      />
    </noscript>
  </head>
  <body class="st-page">
    <header class="an-topbar">
      <div class="an-topbar-left">
        <a class="an-back" href="/" title="Back to klndr">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="klndr-lockup klndr-lockup-topbar" role="img" aria-label="klndr">
          <span class="klndr-plate" aria-hidden="true"><span>k</span></span>
          <span class="klndr-wordmark" aria-hidden="true">klndr</span>
        </span>
        <h1 class="an-sr-only">Announcement Studio</h1>
        <nav class="an-admin-nav" aria-label="Admin tools">
          <a class="an-admin-link" href="/analytics">
            <span class="material-symbols-outlined" aria-hidden="true">insights</span>Analytics
          </a>
          <a class="an-admin-link is-current" href="/announcements" aria-current="page">
            <span class="material-symbols-outlined" aria-hidden="true">campaign</span>Announcements
          </a>
        </nav>
      </div>

      <div class="an-topbar-right">
        <button type="button" class="ann-btn ann-btn-primary" id="stNewButton">
          <span class="material-symbols-outlined" aria-hidden="true">add</span>
          <span class="st-hide-narrow">New announcement</span>
        </button>
      </div>
    </header>

    <!-- Every view - the list, the editor, a post's stats - is rendered into
         this by admin/announcements.js, routed on location.hash. Privacy is
         the endpoints' job, as on analytics: everything here is admin-only. -->
    <main class="st-main" id="stMain" tabindex="-1">
      <p class="an-loading">Opening the studio…</p>
    </main>

    <div class="st-toast" id="stToast" role="status" aria-live="polite" hidden></div>

    <script src="/public/js/theme.js"></script>
    <script src="/protected/js/api.js"></script>
    <script src="/protected/js/palette.js"></script>
    <script src="/admin/charts.js"></script>
    <script src="/protected/js/announcements/rules.js"></script>
    <script src="/protected/js/announcements/markdown.js"></script>
    <script src="/protected/js/motion/motion-core.js"></script>
    <script src="/protected/js/motion/scenes.js"></script>
    <script src="/protected/js/motion/motion-timeline.js"></script>
    <script src="/protected/js/motion/motion-player.js"></script>
    <script src="/protected/js/announcements/media-view.js"></script>
    <script src="/protected/js/announcements/reader.js"></script>
    <script src="/admin/studio/core.js"></script>
    <script src="/admin/studio/uploads.js"></script>
    <script src="/admin/studio/list.js"></script>
    <script src="/admin/studio/editor.js"></script>
    <script src="/admin/studio/editor-sections.js"></script>
    <script src="/admin/studio/editor-media.js"></script>
    <script src="/admin/studio/preview.js"></script>
    <script src="/admin/studio/stats.js"></script>
    <script src="/admin/announcements.js"></script>
  </body>
</html>
