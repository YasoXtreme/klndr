<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers; without it every inset resolves to 0 on notched iOS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2ffec" />
    <!-- The theme stamp, same job as the app's: it must run before the
         stylesheets so the login never opens on the wrong ground and then
         flips. Only a pinned choice needs saying; the OS default is already
         answered by the media query in theme.css. The address-bar tint is set
         by theme.js at the end of the body. -->
    <script>
      try {
        var t = localStorage.getItem('klndr:theme');
        if (t === 'dark' || t === 'light')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}

      // The icon font loads without holding up the first paint (below), and
      // the page's one icon, the waving hand, stays invisible in its fixed box
      // until the font has landed - before that it would read as the words
      // "waving_hand". Three seconds at most, so a blocked font never hides it.
      document.documentElement.classList.add('icons-pending');
      function klndrIconsReady() {
        document.documentElement.classList.remove('icons-pending');
      }
      // Runs on the stylesheet's own load, so the font face it declares exists
      // by then; any earlier and document.fonts would answer straight away.
      function klndrIconSheetApplied() {
        if (!document.fonts || !document.fonts.load) return klndrIconsReady();
        document.fonts
          .load('38px "Material Symbols Outlined"')
          .then(klndrIconsReady, klndrIconsReady);
      }
      setTimeout(klndrIconsReady, 3000);
    </script>
    <title>klndr | Log In</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <!-- The lockup is drawn in ElmsSans Black. Preloading the face keeps the
         mark from landing in Arial and swapping a beat later. -->
    <link
      rel="preload"
      href="/assets/ElmsSans.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <!-- Opened while the page's own files load, so the icon font is not two
         round trips behind them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Third party, so never allowed to block the first paint: a slow or
         blocked Google Fonts used to leave this page blank. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      onload="this.onload = klndrIconSheetApplied; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      />
    </noscript>
    <link rel="stylesheet" href="/public/css/theme.css" />
    <link rel="stylesheet" href="/public/css/common.css" />
    <link rel="stylesheet" href="/public/css/login.css" />
  </head>
  <body>
    <div class="login-page-wrapper">
      <!-- Brand lockup. Deliberately static: this page is instant, and the
           entrance animation belongs to the moment after Continue. Playing it
           twice inside five seconds would spend it. -->
      <div class="login-brand-container">
        <span class="klndr-lockup klndr-lockup-login" role="img" aria-label="klndr">
          <span class="klndr-plate" aria-hidden="true"><span>k</span></span>
          <span class="klndr-lockup-text" aria-hidden="true">
            <span class="klndr-wordmark">klndr</span>
            <span class="klndr-tagline">Think of it. Schedule it.</span>
          </span>
        </span>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <div class="login-card-header">
          <div class="title-group">
            <h1>Hello there</h1>
            <p>Log in to your klndr account</p>
          </div>
          <!-- Google Icon hand gesture with waving animation -->
          <div class="waving-hand">
            <span
              class="material-symbols-outlined"
              style="font-size: 38px; color: var(--ink-strong)"
              >waving_hand</span
            >
          </div>
        </div>

        <form id="loginForm" class="login-form">
          <div id="loginError" class="login-error"></div>

          <div class="form-group">
            <label for="usernameInput">Username</label>
            <input
              type="text"
              id="usernameInput"
              name="username"
              autocomplete="username"
              required
              autofocus
              placeholder="Enter your username"
            />
          </div>

          <div class="form-group">
            <label for="passwordInput">Password</label>
            <input
              type="password"
              id="passwordInput"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn-continue">
              Continue
            </button>
          </div>
        </form>
      </div>

      <!-- Beta Disclaimer Footer -->
      <div class="login-footer-disclaimer">
        <strong>klndr</strong> is currently in beta and is invite only to select
        beta testers, to get access and become a beta tester, contact
        <strong>beta@yassen.dev</strong>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("loginError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: usernameInput.value.trim(),
              password: passwordInput.value,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || "Authentication failed");
          }

          if (data.token) {
            localStorage.setItem("klndr_token", data.token);
            localStorage.setItem("klndr_user", JSON.stringify(data.user));
          }

          // Read once by the app's boot overlay on the very next load, then
          // cleared (public/js/boot.js). It is what separates "just signed
          // in", which earns the kit's full entrance, tagline and all, from
          // every refresh after, which gets the quick one.
          try {
            sessionStorage.setItem(
              "klndr:boot",
              JSON.stringify({ v: 1, kind: "hero", to: "/", at: Date.now() })
            );
          } catch (storageErr) {
            // Storage blocked. The app still loads, with the quick entrance.
          }

          window.location.href = "/";
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Continue";
        }
      });
    </script>
    <script src="/public/js/theme.js"></script>
  </body>
</html>
