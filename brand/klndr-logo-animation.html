<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>klndr — animated logo</title>
<style>
@font-face{font-family:'ElmsSans';src:url('ElmsSans.ttf') format('truetype');font-weight:100 900;font-display:swap}
:root{--ink:#000;--paper:#fff;--mint:#f2ffec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--mint);display:grid;place-items:center;font-family:'ElmsSans',Helvetica,Arial,sans-serif}
.klndr-anim{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.klndr-anim .plate{width:92px;height:92px;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;flex:none;animation:k-plate-in 360ms cubic-bezier(.34,1.56,.64,1) both}
.klndr-anim .plate span{font-size:62px;font-weight:900;letter-spacing:-3.6px;line-height:1;transform:translateY(3px)}
.klndr-anim .text{display:flex;flex-direction:column;gap:6px}
.klndr-anim .name{font-size:62px;font-weight:900;letter-spacing:-3.6px;line-height:.95;animation:k-wipe-in 420ms cubic-bezier(.34,1.56,.64,1) 240ms both}
.klndr-anim .tag{font-size:15px;font-weight:700;animation:k-fade-up 300ms ease 620ms both}
@keyframes k-plate-in{0%{opacity:0;transform:translateY(26px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes k-wipe-in{0%{clip-path:inset(0 100% 0 0);transform:translateX(-14px)}100%{clip-path:inset(0 0 0 0);transform:none}}
@keyframes k-fade-up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.klndr-anim *{animation:none!important}}
button{margin-top:28px;font:700 14px 'ElmsSans',Helvetica,sans-serif;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:9px 16px;cursor:pointer;transition:transform 90ms ease,box-shadow 90ms ease}
button:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.wrap{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<div class="wrap">
  <div class="klndr-anim" id="logo">
    <div class="plate"><span>k</span></div>
    <div class="text"><div class="name">klndr</div><div class="tag">Think of it. Schedule it.</div></div>
  </div>
  <button type="button" onclick="replay()">Replay</button>
</div>
<script>
function replay(){var n=document.getElementById('logo'),c=n.cloneNode(true);n.replaceWith(c);c.id='logo';}
</script>
</body></html>
